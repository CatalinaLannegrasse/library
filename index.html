<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <h1>📚 My Library</h1>
        <button id="new-book-btn" class="btn">Add Book</button>
    </header>

    <!-- Main Container where book cards will be injected via JS -->
    <main class="library-container" id="library-container">
        <!-- Book cards will appear here dynamically -->
    </main>

    <!-- Dialog / Form Modal for Adding Books -->
    <dialog id="book-dialog">
        <form id="book-form" method="dialog">
            <h2>Add a New Book</h2>
            
            <div class="form-row">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-row">
                <label for="author">Author:</label>
                <input type="text" id="author" name="author" required>
            </div>

            <div class="form-row">
                <label for="num_pages">Pages:</label>
                <input type="number" id="num_pages" name="num_pages" min="1" required>
            </div>

            <div class="form-row checkbox-row">
                <label for="read">Have you read this book?</label>
                <input type="checkbox" id="read" name="read">
            </div>

            <div class="form-buttons">
                <button type="submit" id="submit-btn" class="btn">Submit</button>
                <button type="button" id="cancel-btn" class="btn secondary-btn">Cancel</button>
            </div>
        </form>
    </dialog>

    <script src="script.js" defer></script>
</body>
</html>
